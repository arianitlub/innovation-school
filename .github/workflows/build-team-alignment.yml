name: Build Innovation School presentations

on:
  push:
    branches: [main]
    paths:
      - 'tools/create_innovation_deck.js'
      - 'tools/create_design_thinking_status.js'
      - 'tools/create_future_scenario.js'
      - 'tools/create_my_wealth_solution.js'
      - 'tools/create_my_wealth_pitch_v3.js'
      - 'tools/append_my_wealth_pitch_v4.py'
      - 'tools/assets/business-case-focus.jpg'
      - 'tools/assets/business-case-ingredients.jpg'
      - '.github/workflows/build-team-alignment.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install presentation tools
        run: |
          npm install pptxgenjs
          python -m pip install python-pptx pillow
          sudo apt-get update
          sudo apt-get install -y libreoffice-impress fonts-liberation
      - name: Build PDFs
        run: |
          node tools/create_innovation_deck.js
          node tools/create_design_thinking_status.js
          node tools/create_future_scenario.js
          node tools/create_my_wealth_solution.js
          node tools/create_my_wealth_pitch_v3.js
          python tools/append_my_wealth_pitch_v4.py
          libreoffice --headless --convert-to pdf --outdir docs/2-challenge-wealth-advice/presentations docs/2-challenge-wealth-advice/presentations/innovation-challenge-team-alignment.pptx
          libreoffice --headless --convert-to pdf --outdir docs/2-challenge-wealth-advice/presentations docs/2-challenge-wealth-advice/presentations/design-thinking-journey-status.pptx
          libreoffice --headless --convert-to pdf --outdir docs/2-challenge-wealth-advice/presentations docs/2-challenge-wealth-advice/presentations/future-scenario-design-thinking.pptx
          libreoffice --headless --convert-to pdf --outdir docs/2-challenge-wealth-advice/presentations docs/2-challenge-wealth-advice/presentations/my-wealth-proposed-solution.pptx
          libreoffice --headless --convert-to pdf --outdir docs/2-challenge-wealth-advice/presentations docs/2-challenge-wealth-advice/presentations/my-wealth-5min-pitch-v3.pptx
          libreoffice --headless --convert-to pdf --outdir docs/2-challenge-wealth-advice/presentations docs/2-challenge-wealth-advice/presentations/my-wealth-5min-pitch-v4-business-case.pptx
          test -s docs/2-challenge-wealth-advice/presentations/innovation-challenge-team-alignment.pdf
          test -s docs/2-challenge-wealth-advice/presentations/design-thinking-journey-status.pdf
          test -s docs/2-challenge-wealth-advice/presentations/future-scenario-design-thinking.pdf
          test -s docs/2-challenge-wealth-advice/presentations/my-wealth-proposed-solution.pdf
          test -s docs/2-challenge-wealth-advice/presentations/my-wealth-5min-pitch-v3.pdf
          test -s docs/2-challenge-wealth-advice/presentations/my-wealth-5min-pitch-v4-business-case.pdf
          rm -f docs/2-challenge-wealth-advice/presentations/*.pptx
      - name: Commit generated PDFs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/2-challenge-wealth-advice/presentations/innovation-challenge-team-alignment.pdf docs/2-challenge-wealth-advice/presentations/design-thinking-journey-status.pdf docs/2-challenge-wealth-advice/presentations/future-scenario-design-thinking.pdf docs/2-challenge-wealth-advice/presentations/my-wealth-proposed-solution.pdf docs/2-challenge-wealth-advice/presentations/my-wealth-5min-pitch-v3.pdf docs/2-challenge-wealth-advice/presentations/my-wealth-5min-pitch-v4-business-case.pdf
          git diff --cached --quiet && exit 0
          git commit -m 'Build Innovation School PDF presentations'
          git pull --rebase origin main
          git push origin HEAD:main
